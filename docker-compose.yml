services:
    db:
        container_name: 'postgres-dev'
        image: postgres:16.14-alpine
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: mysecretpassword
            POSTGRES_DB: local
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
volumes:
    pgdata:
